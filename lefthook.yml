pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,ts,svelte,json,md}'
      run: pnpm exec prettier --write {staged_files}
    lint:
      glob: '*.{js,ts,svelte}'
      run: pnpm exec eslint {staged_files}
    secret-scan:
      run: pnpm exec secretlint {staged_files}
    actionlint:
      glob: '.github/workflows/*.yml'
      run: actionlint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm run check
    test:
      # Coverage run so the CI floors (vite.config thresholds) are enforced on push.
      run: pnpm run test:coverage
    e2e:
      run: pnpm run test:e2e
