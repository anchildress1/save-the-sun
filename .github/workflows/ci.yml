name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - 'poc/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so SonarCloud has SCM blame — avoids the shallow-clone warning

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Unit Tests
        run: make test

      - name: Build
        run: make build

      - name: E2E Tests
        run: make e2e

      - name: SonarQube Cloud Scan
        # The 40-char hex is the action's pinned commit SHA (per our SHA-pin convention),
        # not a SonarQube API key — suppress the generic secret matcher's false positive.
        # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Block until the Compute Engine finishes so the issue count below is final, not stale.
          args: -Dsonar.qualitygate.wait=true

      - name: Enforce zero Sonar issues
        # The default quality gate tolerates low-severity issues; we don't. Fail CI on ANY
        # unresolved issue of ANY severity. Runs after the scan's qualitygate.wait, so the
        # analysis is fully computed and the issue count is authoritative.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            scope="pullRequest=${PR_NUMBER}"
          else
            scope="branch=main"
          fi
          api="https://sonarcloud.io/api/issues/search?componentKeys=anchildress1_save-the-sun&${scope}&resolved=false"
          result=$(curl -sfSL -u "${SONAR_TOKEN}:" "${api}&ps=100")
          count=$(echo "$result" | jq -r '.total')
          echo "Unresolved Sonar issues for ${scope}: ${count}"
          if [ "${count}" != "0" ]; then
            echo "$result" | jq -r '.issues[] | "::error::[\(.severity)] \(.component | sub("^[^:]+:";"")):\(.textRange.startLine // 0) \(.rule) — \(.message)"'
            echo "::error::SonarCloud reports ${count} unresolved issue(s); CI fails on any severity."
            exit 1
          fi
